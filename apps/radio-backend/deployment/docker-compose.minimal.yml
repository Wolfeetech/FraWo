# Minimal docker-compose for resource-constrained deployment
# Uses less memory, no monitoring stack

version: '3.8'

services:
  # PostgreSQL with minimal resources
  postgres:
    image: postgres:16-alpine
    container_name: radio-db
    environment:
      POSTGRES_USER: radio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radio}
      POSTGRES_DB: frawo_radio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radio"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - radio-network

  # Redis with minimal config
  redis:
    image: redis:7-alpine
    container_name: radio-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - radio-network

  # Backend with single worker
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: radio-backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://radio:${POSTGRES_PASSWORD:-radio}@postgres:5432/frawo_radio
      REDIS_URL: redis://redis:6379/0
      WORKERS: 1  # Single worker for low memory
    ports:
      - "9500:8000"
      - "9590:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../app:/app/app:ro
    networks:
      - radio-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
  redis_data:

networks:
  radio-network:
    driver: bridge
