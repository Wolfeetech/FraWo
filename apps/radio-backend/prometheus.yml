global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'frawo-radio'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'frawo-radio-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:9090']
        labels:
          service: 'radio-backend'
          environment: 'production'
