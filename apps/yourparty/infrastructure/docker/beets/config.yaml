# FRAWO RADIO — Beets Library Config v2.0
# Standard: EBU R128 | MusicBrainz + Discogs + AcoustID
# Workflow:  MOVE (keine Kopien, kein doppelter Speicher)
# Erste Nutzung: beet import --pretend /mnt/source/

directory: /mnt/radio_master
library: /config/library.db
log: /config/import.log

import:
    write: yes
    copy: no
    move: yes
    resume: yes
    incremental: yes
    quiet_fallback: asis
    timid: no
    duplicate_action: ask
    languages: [de, en]

plugins:
    - chroma
    - fetchart
    - embedart
    - lastgenre
    - discogs
    - web
    - scrub
    - replaygain
    - duplicates
    - mbsync
    - edit
    - info

match:
    strong_rec_thresh: 0.10
    medium_rec_thresh: 0.25
    rec_gap_thresh: 0.20
    preferred:
        media: ['Digital Media', 'CD']
        countries: ['DE', 'AT', 'CH', 'GB', 'US']

musicbrainz:
    searchlimit: 5
    extra_tags: [year, catalognum, country, media, label]

chroma:
    auto: yes

discogs:
    user_token: ${DISCOGS_TOKEN}
    source_weight: 0.7

fetchart:
    auto: yes
    cautious: yes
    minwidth: 500
    sources:
        - filesystem
        - coverart
        - albumart
        - discogs
        - lastfm

embedart:
    auto: yes
    ifempty: yes
    maxwidth: 1000

lastgenre:
    auto: yes
    canonical: yes
    count: 1
    fallback: 'Electronic'
    force: no
    source: album

replaygain:
    auto: yes
    backend: ffmpeg
    overwrite: yes
    threads: 4

duplicates:
    checksum: no
    copy: no
    move: no
    delete: no
    tag: dup

scrub:
    auto: yes

paths:
    default: '%the{$albumartist}/$year - $album%aunique{}/$disc$track - $title'
    singleton: '_Singles/%the{$artist}/$year - $title'
    comp: '_Compilations/$year - $album%aunique{}/$disc$track - $title'

web:
    host: 0.0.0.0
    port: 8337
    readonly: no

convert:
    auto: no
    ffmpeg: /usr/bin/ffmpeg
    format: mp3
    formats:
        mp3:
            command: ffmpeg -i $source -b:a 320k $dest
            extension: mp3

id3v23: no
