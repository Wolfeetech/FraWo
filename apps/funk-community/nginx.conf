server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS — re-resolve upstream IPs per request (survives backend restarts)
    resolver 127.0.0.11 valid=10s;

    location /api/v1/community/ {
        # Variable in proxy_pass disables nginx URI substitution — use $request_uri to pass path as-is
        set $upstream frawo-radio-backend;
        proxy_pass http://$upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve real client IP forwarded by Caddy upstream
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Let FastAPI handle CORS — do not add conflicting headers here
    }

    location /api/ {
        proxy_pass http://azuracast/api/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    location /listen/ {
        proxy_pass http://azuracast/listen/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
