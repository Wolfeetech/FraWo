server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/community/ {
        proxy_pass http://frawo-radio-backend:8000/api/v1/community/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve real client IP forwarded by Caddy upstream — backend reads first value
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Let FastAPI handle CORS — do not add conflicting headers here
    }

    location /api/ {
        proxy_pass http://azuracast/api/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    location /listen/ {
        proxy_pass http://azuracast/listen/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
