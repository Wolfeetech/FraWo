<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FraWo Funk — Community</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --border: #222;
  --accent: #e63946;
  --accent2: #457b9d;
  --text: #f1f1f1;
  --muted: #888;
  --up: #4ade80;
  --down: #f87171;
  --radius: 8px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

/* HEADER */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 50;
}
.logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
.live-pill {
  display: flex; align-items: center; gap: 8px; font-size: 12px;
  font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
}
.live-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
.live-dot.on { animation: blink 1.4s infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
.listener-count { font-size: 13px; color: var(--muted); }

/* LAYOUT */
main { max-width: 1140px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 1fr 340px; gap: 32px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }

/* NOW PLAYING */
.now-playing {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 32px; display: flex; gap: 28px; align-items: flex-start;
}
.track-art {
  width: 120px; height: 120px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
  background: #1a1a1a;
}
.track-info { flex: 1; min-width: 0; }
.station-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.track-title { font-size: 24px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-artist { font-size: 15px; color: var(--muted); margin-bottom: 20px; }
.progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width 1s linear; }

/* PLAYER */
.player-row { display: flex; align-items: center; gap: 14px; }
.play-btn {
  width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--accent); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: transform .15s, background .15s; flex-shrink: 0;
}
.play-btn:hover { transform: scale(1.08); background: #c1121f; }
.play-btn.loading { background: var(--muted); }
.volume-wrap { display: flex; align-items: center; gap: 8px; flex: 1; }
.vol-icon { color: var(--muted); font-size: 14px; }
input[type=range] { flex: 1; height: 4px; accent-color: var(--accent); cursor: pointer; }

/* VOTE SECTION */
.vote-section { margin-top: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.vote-label { font-size: 13px; color: var(--muted); }
.vote-btn {
  display: flex; align-items: center; gap: 6px; padding: 8px 16px;
  border-radius: 20px; border: 1px solid var(--border); background: transparent;
  color: var(--text); cursor: pointer; font-size: 14px; font-weight: 600;
  transition: all .15s;
}
.vote-btn:hover { border-color: var(--muted); }
.vote-btn.active-up { border-color: var(--up); background: rgba(74,222,128,.1); color: var(--up); }
.vote-btn.active-down { border-color: var(--down); background: rgba(248,113,113,.1); color: var(--down); }
.vote-count { font-size: 13px; color: var(--muted); }

/* REQUEST */
.request-section { margin-top: 24px; }
.section-title { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
.request-form { display: flex; gap: 8px; }
.request-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; color: var(--text); font-size: 14px;
}
.request-input:focus { outline: none; border-color: var(--accent2); }
.request-btn {
  background: var(--accent2); border: none; border-radius: var(--radius); padding: 10px 18px;
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
}
.request-btn:hover { background: #1d3557; }
.request-results { margin-top: 8px; }
.request-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px;
  font-size: 13px;
}
.request-item-info { min-width: 0; }
.request-item-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.request-item-artist { color: var(--muted); font-size: 12px; }
.req-submit { background: none; border: 1px solid var(--accent2); border-radius: 4px; padding: 4px 10px; color: var(--accent2); font-size: 12px; cursor: pointer; white-space: nowrap; }
.req-submit:hover { background: var(--accent2); color: #fff; }
.req-msg { font-size: 12px; color: var(--up); margin-top: 4px; }

/* SIDEBAR */
aside { display: flex; flex-direction: column; gap: 20px; }

/* CHAT */
.chat-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; flex-direction: column; height: 440px;
}
.chat-header { padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chat-messages { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.chat-msg { font-size: 13px; line-height: 1.4; }
.chat-msg-name { font-weight: 600; color: var(--accent2); margin-right: 6px; }
.chat-msg-text { color: var(--text); word-break: break-word; }
.chat-form { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.chat-name-input, .chat-text-input {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px;
  color: var(--text); font-size: 13px;
}
.chat-name-input { width: 90px; flex-shrink: 0; }
.chat-text-input { flex: 1; }
.chat-name-input:focus, .chat-text-input:focus { outline: none; border-color: var(--accent2); }
.chat-send {
  background: var(--accent2); border: none; border-radius: 6px; padding: 8px 14px;
  color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s;
}
.chat-send:hover { background: #1d3557; }

/* HISTORY */
.history-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px;
}
.history-item { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.history-item:last-child { border-bottom: none; }
.history-num { font-size: 11px; color: var(--muted); width: 20px; flex-shrink: 0; }
.history-info { min-width: 0; }
.history-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-artist { font-size: 11px; color: var(--muted); }

audio { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">FraWo<span>Funk</span></div>
  <div class="live-pill">
    <div class="live-dot" id="liveDot"></div>
    <span id="liveLabel">Lädt...</span>
  </div>
  <div class="listener-count" id="listenerCount"></div>
</header>

<main>
  <!-- LEFT: Player + Voting + Requests -->
  <section>
    <div class="now-playing">
      <img class="track-art" id="trackArt" src="" alt="" onerror="this.style.visibility='hidden'">
      <div class="track-info">
        <div class="station-label">Jetzt läuft</div>
        <div class="track-title" id="trackTitle">Lädt...</div>
        <div class="track-artist" id="trackArtist"></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="player-row">
          <button class="play-btn" id="playBtn" title="Play/Pause">▶</button>
          <div class="volume-wrap">
            <span class="vol-icon">🔈</span>
            <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.8">
            <span class="vol-icon">🔊</span>
          </div>
        </div>
      </div>
    </div>
    <audio id="audioEl" preload="none"></audio>

    <div class="vote-section">
      <span class="vote-label">Track bewerten:</span>
      <button class="vote-btn" id="upBtn" onclick="vote('up')">👍 <span id="upCount">—</span></button>
      <button class="vote-btn" id="downBtn" onclick="vote('down')">👎 <span id="downCount">—</span></button>
      <span class="vote-count" id="voteStatus"></span>
    </div>

    <div class="request-section">
      <div class="section-title">Song wünschen</div>
      <div class="request-form">
        <input class="request-input" id="reqInput" type="text" placeholder="Titel oder Künstler suchen…">
        <button class="request-btn" onclick="searchRequests()">Suchen</button>
      </div>
      <div class="request-results" id="reqResults"></div>
    </div>
  </section>

  <!-- RIGHT: Chat + History -->
  <aside>
    <div class="chat-box">
      <div class="chat-header">Community Chat</div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-form" onsubmit="sendChat(event)">
        <input class="chat-name-input" id="chatName" type="text" placeholder="Name" maxlength="30" value="">
        <input class="chat-text-input" id="chatText" type="text" placeholder="Schreib etwas…" maxlength="280">
        <button class="chat-send" type="submit">→</button>
      </form>
    </div>

    <div class="history-box">
      <div class="section-title" style="margin-bottom:12px">Zuletzt gespielt</div>
      <div id="historyList"></div>
    </div>
  </aside>
</main>

<script>
const API = '/api/v1/community';
const AZURA_API = '/api/nowplaying/1';

let streamUrl = null;
let currentTrackKey = null;
let isPlaying = false;
const audio = document.getElementById('audioEl');
const playBtn = document.getElementById('playBtn');

// --- AUDIO PLAYER ---
document.getElementById('volSlider').addEventListener('input', e => { audio.volume = e.target.value; });
audio.volume = 0.8;

playBtn.addEventListener('click', () => {
  if (!streamUrl) return;
  if (isPlaying) {
    audio.pause();
    audio.src = '';
    playBtn.textContent = '▶';
    isPlaying = false;
  } else {
    playBtn.classList.add('loading');
    playBtn.textContent = '⏳';
    audio.src = streamUrl;
    audio.play().then(() => {
      playBtn.textContent = '⏸';
      playBtn.classList.remove('loading');
      isPlaying = true;
    }).catch(() => {
      playBtn.textContent = '▶';
      playBtn.classList.remove('loading');
      isPlaying = false;
    });
  }
});

// --- NOW PLAYING ---
let lastTrackKey = null;

async function updateNowPlaying() {
  try {
    const r = await fetch(`${API}/nowplaying`);
    if (!r.ok) throw new Error('not ok');
    const d = await r.json();

    document.getElementById('trackTitle').textContent = d.title || '—';
    document.getElementById('trackArtist').textContent = d.artist || '';
    document.getElementById('listenerCount').textContent = `${d.listeners} Hörer`;
    document.getElementById('liveDot').classList.add('on');
    document.getElementById('liveLabel').textContent = 'LIVE';

    if (d.art) {
      const img = document.getElementById('trackArt');
      img.src = d.art;
      img.style.visibility = 'visible';
    }

    if (d.stream_url && !streamUrl) {
      streamUrl = d.stream_url;
    }

    const elapsed = d.elapsed || 0;
    const duration = d.duration || 1;
    document.getElementById('progressFill').style.width = `${Math.min(100, (elapsed / duration) * 100)}%`;

    const key = `${d.artist}|${d.title}`;
    if (key !== lastTrackKey) {
      lastTrackKey = key;
      currentTrackKey = key;
      resetVotes();
      loadVotes(key);
      updateHistory(d);
    }
  } catch {
    document.getElementById('liveLabel').textContent = 'Offline';
    document.getElementById('liveDot').classList.remove('on');
  }
}

function updateHistory(nowPlaying) {
  const list = document.getElementById('historyList');
  const existing = Array.from(list.querySelectorAll('.history-item'));
  const newItem = document.createElement('div');
  newItem.className = 'history-item';
  newItem.innerHTML = `<span class="history-num">${existing.length + 1}</span><div class="history-info"><div class="history-title">${esc(nowPlaying.title)}</div><div class="history-artist">${esc(nowPlaying.artist)}</div></div>`;
  list.prepend(newItem);
  Array.from(list.querySelectorAll('.history-num')).forEach((el, i) => el.textContent = i + 1);
  while (list.children.length > 8) list.removeChild(list.lastChild);
}

// --- VOTING ---
function resetVotes() {
  document.getElementById('upCount').textContent = '—';
  document.getElementById('downCount').textContent = '—';
  document.getElementById('upBtn').className = 'vote-btn';
  document.getElementById('downBtn').className = 'vote-btn';
  document.getElementById('voteStatus').textContent = '';
}

async function loadVotes(key) {
  try {
    const r = await fetch(`${API}/votes/${encodeURIComponent(key)}`);
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('upCount').textContent = d.up;
    document.getElementById('downCount').textContent = d.down;
    if (d.your_vote) highlightVote(d.your_vote);
  } catch {}
}

async function vote(reaction) {
  if (!currentTrackKey) return;
  try {
    const r = await fetch(`${API}/vote`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({reaction, track_key: currentTrackKey})
    });
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('upCount').textContent = d.up;
    document.getElementById('downCount').textContent = d.down;
    highlightVote(reaction);
  } catch {}
}

function highlightVote(r) {
  document.getElementById('upBtn').className = 'vote-btn' + (r === 'up' ? ' active-up' : '');
  document.getElementById('downBtn').className = 'vote-btn' + (r === 'down' ? ' active-down' : '');
}

// --- REQUESTS ---
let reqDebounce;
document.getElementById('reqInput').addEventListener('keyup', () => {
  clearTimeout(reqDebounce);
  reqDebounce = setTimeout(searchRequests, 400);
});

async function searchRequests() {
  const q = document.getElementById('reqInput').value.trim();
  const el = document.getElementById('reqResults');
  if (q.length < 2) { el.innerHTML = ''; return; }
  try {
    const r = await fetch(`${API}/requests/search?q=${encodeURIComponent(q)}`);
    if (!r.ok) throw new Error('fail');
    const data = await r.json();
    const items = Array.isArray(data) ? data : (data.result || []);
    if (!items.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:8px 0">Nichts gefunden.</p>'; return; }
    const fixArt = u => u ? u.replace(/^https?:\/\/(172\.20\.0\.1|localhost|azuracast)/, window.location.origin) : '';
    el.innerHTML = items.slice(0, 6).map(item => {
      const art = fixArt(item.song?.art || '');
      return `<div class="request-item">
        ${art ? `<img src="${art}" style="width:36px;height:36px;border-radius:4px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">` : ''}
        <div class="request-item-info">
          <div class="request-item-title">${esc(item.song?.title || item.title || '')}</div>
          <div class="request-item-artist">${esc(item.song?.artist || item.artist || '')}</div>
        </div>
        <button class="req-submit" onclick="submitRequest('${esc(item.request_id || item.id || '')}', this)">Wünschen</button>
      </div>`;
    }).join('');
  } catch {
    el.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:8px 0">Suche nicht verfügbar.</p>';
  }
}

async function submitRequest(id, btn) {
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await fetch(`${API}/requests/${id}`, {method:'POST'});
    const d = await r.json();
    btn.textContent = d.status === 'queued' ? '✓' : '!';
  } catch { btn.textContent = '✗'; }
}

// --- CHAT ---
let chatPollInterval;
let lastChatId = 0;
const savedName = localStorage.getItem('chat_name') || '';
if (savedName) document.getElementById('chatName').value = savedName;

async function loadChat() {
  try {
    const r = await fetch(`${API}/chat?limit=50`);
    if (!r.ok) return;
    const msgs = await r.json();
    const el = document.getElementById('chatMessages');
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
    const newMsgs = msgs.filter(m => m.id > lastChatId);
    if (!newMsgs.length) return;
    newMsgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.innerHTML = `<span class="chat-msg-name">${esc(m.name)}</span><span class="chat-msg-text">${esc(m.text)}</span>`;
      el.appendChild(div);
      lastChatId = Math.max(lastChatId, m.id);
    });
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch {}
}

async function sendChat(e) {
  e.preventDefault();
  const name = document.getElementById('chatName').value.trim() || 'Anonym';
  const text = document.getElementById('chatText').value.trim();
  if (!text) return;
  localStorage.setItem('chat_name', name);
  try {
    const r = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, text})
    });
    if (r.ok) {
      document.getElementById('chatText').value = '';
      await loadChat();
    }
  } catch {}
}

// --- UTILS ---
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// --- INIT ---
updateNowPlaying();
setInterval(updateNowPlaying, 10000);
loadChat();
setInterval(loadChat, 5000);
</script>
</body>
</html>
