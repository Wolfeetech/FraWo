---
- name: unattended-upgrades installieren
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Automatische Sicherheits-Updates konfigurieren, kein Auto-Reboot
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52frawo-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

# apt.conf.d liest nur Dateien ohne Endung oder mit ".conf" - ".local" wird
# stillschweigend ignoriert (Dir::Ignore-Files-Silently). Die alte Datei war
# auf beiden Servern nie wirksam, obwohl Ansible "changed"/"ok" meldete.
- name: Alte, wirkungslose .local-Konfigurationsdatei entfernen
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/50unattended-upgrades.local
    state: absent

- name: Taeglichen Update-Check aktivieren
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
