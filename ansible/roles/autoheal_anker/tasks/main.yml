---
# Die vier Watchdog-Paket-Tasks (Installation/Konfiguration/Dienst des
# generischen Debian-Pakets "watchdog") wurden entfernt: Proxmox bringt mit
# pve-ha-manager bereits seinen eigenen Watchdog-Mechanismus (watchdog-mux)
# mit, der /dev/watchdog exklusiv haelt, und pve-ha-manager hat ein hartes
# "Conflicts: watchdog" gegen genau dieses Paket. Ein echter Lauf haette
# proxmox-ve/pve-container/pve-ha-manager/pve-manager/qemu-server entfernt,
# um "watchdog" zu installieren. Live gegen anker-pve verifiziert am
# 2026-08-20 (watchdog-mux laeuft bereits aktiv). Bitte nicht wieder
# hinzufuegen, ohne das zu pruefen.
- name: Automatischen Neustart nach Kernel-Panik aktivieren
  ansible.posix.sysctl:
    name: kernel.panic
    value: "10"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-autoheal.conf
