---
- name: Aktuellen onboot-Wert je Gast auslesen
  ansible.builtin.command: "{{ item.type }} config {{ item.id }}"
  loop: "{{ guests | default([]) }}"
  loop_control:
    label: "{{ item.type }} {{ item.id }}"
  register: guest_config
  changed_when: false
  # Ein geloeschter/umnummerierter Gast darf nicht das ganze Playbook fuer
  # diesen Host abbrechen - sonst laufen die spaeteren, sicherheitsrelevanten
  # Rollen (unattended_updates, fail2ban) fuer diesen Host gar nicht mehr.
  ignore_errors: true

- name: Autostart (onboot) setzen, falls noch nicht aktiv
  ansible.builtin.command: >
    {{ item.item.type }} set {{ item.item.id }} -onboot 1
  loop: "{{ guest_config.results }}"
  loop_control:
    label: "{{ item.item.type }} {{ item.item.id }}"
  when: "item.rc is not defined or (item.rc == 0 and 'onboot: 1' not in item.stdout)"
  changed_when: true

- name: Start-Reihenfolge setzen, wo im Inventory angegeben
  ansible.builtin.command: >
    {{ item.type }} set {{ item.id }}
    -startup order={{ item.order }}{{ (',up=' + (item.up | string)) if item.up is defined else '' }}
  loop: "{{ guests | default([]) }}"
  loop_control:
    label: "{{ item.type }} {{ item.id }}"
  when: item.order is defined
  changed_when: true
  # Gleicher Grund wie oben: ein einzelner ungueltiger Gast (z.B. geloescht,
  # aber noch mit order: in host_vars) darf den restlichen Lauf nicht kippen.
  ignore_errors: true
