# WICHTIG zu instance!="monitoring-stack" (ergaenzt 28.07.2026):
#
# Von den drei node_exporter-Zielen ist "monitoring-stack" kein Rechner,
# sondern der LXC-Container CT150 auf dem ProDesk. Ohne lxcfs liest ein
# Container /proc des Wirtssystems - CPU, Last und Speicher sind dort also
# die Werte des ProDesk, nicht die des Containers.
#
# Folge: Dieselbe Last erschien zweimal unter verschiedenen Namen, und der
# Alarm zeigte auf den Container statt auf den echten Verursacher. Bei der
# Fehlersuche schickt das in die Irre.
#
# Deshalb sind CPU-, Speicher- und Last-Alarme auf die beiden echten Hosts
# begrenzt. Dateisystem-Alarme bleiben fuer alle gueltig - df liest echte
# Einhaengepunkte und meldet pro Container korrekt.
#
# Saubere Loesung waere lxcfs auf beiden Knoten (siehe Odoo #877).

groups:
  - name: frawo_infra
    rules:
      - alert: HighCPU
        expr: >-
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle",instance!="monitoring-stack"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}%"

      - alert: HighMemory
        expr: >-
          (1 - (node_memory_MemAvailable_bytes{instance!="monitoring-stack"}
          / node_memory_MemTotal_bytes{instance!="monitoring-stack"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}%"

      - alert: DiskAlmostFull
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint="/"} / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint="/"})) * 100 > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Disk > 90% on {{ $labels.instance }}"
          description: "Disk {{ $labels.mountpoint }} at {{ $value | printf \"%.1f\" }}%"

      - alert: NodeDown
        expr: up{job="node_exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is DOWN"
          description: "Node exporter unreachable for 2+ minutes"

      - alert: HighLoadAverage
        expr: >-
          node_load5{instance!="monitoring-stack"}
          > on(instance) count by(instance) (node_cpu_seconds_total{mode="idle",instance!="monitoring-stack"}) * 1.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High load on {{ $labels.instance }}"
          description: >-
            Load5 ist {{ $value | printf "%.2f" }}. Hinweis: Auf dem ProDesk
            zaehlt auch Warten auf die USB-Platten in die Last hinein
            (ntfs-3g laeuft im Benutzerbereich). Vor Massnahmen mit
            `vmstat 2 5` pruefen, ob wirklich CPU knapp ist oder nur E/A wartet.

      - alert: ServiceDown
        expr: probe_success{job=~"blackbox_.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service DOWN: {{ $labels.instance }}"
          description: "HTTP probe failed for 2+ minutes"
      # HighSwapUsage wurde am 27.07.2026 entfernt: Die Regel maß die Swap-
      # *Belegung* und stand deshalb dauerhaft an, obwohl der Host gar nicht
      # mehr auslagerte (vmstat si/so = 0). Ersetzt durch SwapThrashing und
      # SwapFastVoll in frawo_memory_pressure.yml.
