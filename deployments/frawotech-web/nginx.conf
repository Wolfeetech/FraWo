# FraWo 2.0 - Nginx Reverse Proxy Config for CT140 (frawotech-web)
# Location: /opt/frawotech/nginx.conf

# Real IP handling for Cloudflare & internal proxies
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Cloudflare IPv4 ranges
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# AI Bot & Scraper detection map
map $http_user_agent $is_ai_or_bot {
    default 0;
    ~*(?i)(GPTBot|ChatGPT-User|ClaudeBot|Claude-Web|PerplexityBot|Bytespider|PetalBot|Amazonbot|Applebot-Extended|CCBot|Diffbot|FacebookBot|Google-Extended|Omgilibot|YouBot|cohere-ai|ia_archiver) 1;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_status 429;

upstream odoo_app {
    server odoo:8069;
}

upstream odoo_gevent {
    server odoo:8072;
}

server {
    listen 80;
    listen 8069;
    server_name _;

    client_max_body_size 100M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Gzip
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Scanner & vulnerability probe blocking
    location ~* \.(php|aspx|jsp|env|git|svn|bak|conf)$ {
        return 404;
    }
    location ~* (wp-admin|wp-login|xmlrpc\.php|phpmyadmin|pma|adminer) {
        return 404;
    }

    # Protected Login & Auth routes
    location ~* ^/web/(login|session/authenticate|signup) {
        if ($is_ai_or_bot) {
            return 403 "Forbidden: Automated AI bot access to login is blocked.";
        }
        limit_req zone=login_limit burst=5 nodelay;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_pass http://odoo_app;
        proxy_redirect off;
    }

    # Protected XML-RPC / JSON-RPC APIs
    location ~* ^/(xmlrpc|jsonrpc) {
        if ($is_ai_or_bot) {
            return 403 "Forbidden: Automated bot access blocked.";
        }
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://odoo_app;
        proxy_redirect off;
    }

    # WebSocket / Longpolling routing
    location /websocket {
        proxy_pass http://odoo_gevent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Standard Odoo HTTP backend
    location / {
        proxy_pass http://odoo_app;
        proxy_redirect off;
    }
}