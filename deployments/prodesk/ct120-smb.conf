[global]
   workgroup = WORKGROUP
   server string = FraWo High-Performance Media Server
   server role = standalone server
   passdb backend = tdbsam
   log file = /var/log/samba/log.%m
   max log size = 1000
   panic action = /usr/share/samba/panic-action %d

   # =========================================================================
   # 🚀 HIGH-PERFORMANCE AUDIO / DJ MEDIA STREAMING & LOW-LATENCY TUNING
   # =========================================================================
   # 1. Modern SMB 3.1.1 & Multi-Channel
   server min protocol = SMB2_10
   server max protocol = SMB3_11
   server multi channel support = yes

   # 2. 8 MB Large Buffers for Instant Audio Waveform & File Ingestion
   smb2 max read = 8388608
   smb2 max write = 8388608
   smb2 max trans = 8388608
   max xmit = 65535

   # 3. Asynchronous I/O (Prevents Rekordbox Batch Analysis Freezes)
   aio read size = 1
   aio write size = 1
   use sendfile = yes
   min receivefile size = 16384

   # 4. Lock-Free Multi-Threaded Audio Processing
   # (Crucial: Eliminates Windows SMB locking deadlocks during Rekordbox parallel analysis)
   strict locking = no
   oplocks = yes
   level2 oplocks = yes
   kernel oplocks = yes

   # 5. Fast Directory Indexing & Metadata Caching
   ea support = yes
   store dos attributes = no
   map archive = no
   map hidden = no
   map readonly = no
   map system = no

   # User & Password Handling
   obey pam restrictions = yes
   unix password sync = no
   map to guest = bad user
   usershare max shares = 0

[music]
    comment = FraWo Master Music & DJ Library (Ultra High Performance)
    path = /mnt/music
    browsable = yes
    read only = yes
    guest ok = no
    valid users = wolf musicassistant streamstation
    force group = musicassistant
    create mask = 0640
    directory mask = 0750
    hosts allow = 10.0.0.0/24 10.1.0.0/24 192.168.2.0/24 100.64.0.0/10 192.168.178.0/24
    hosts deny  = 0.0.0.0/0
    read list = wolf musicassistant streamstation
    write list = wolf musicassistant streamstation
    # M: zeigt ausschliesslich Musik - die Dokumentenablage wird ausgeblendet
    veto files = /_Dokumente/
    delete veto files = no
    # Share specific tuning
    strict locking = no
    oplocks = yes
    level2 oplocks = yes

[documents]
    comment = FraWo Dokumente (Belege, Scans, Sicherungen, private Ablage)
    path = /mnt/music/_Dokumente
    browsable = yes
    read only = no
    guest ok = no
    valid users = wolf streamstation scanner
    force group = musicassistant
    create mask = 0664
    directory mask = 0775
    hosts allow = 10.0.0.0/24 10.1.0.0/24 192.168.2.0/24 100.64.0.0/10 192.168.178.0/24
    hosts deny  = 0.0.0.0/0
    write list = wolf streamstation scanner

[scans]
    comment = Scanner dropbox
    path = /mnt/music/_Dokumente/Scans
    browsable = yes
    read only = no
    guest ok = no
    valid users = wolf streamstation scanner
    force group = nogroup
    create mask = 0660
    directory mask = 0770
    hosts allow = 10.0.0.0/24 10.1.0.0/24 192.168.2.0/24 100.64.0.0/10 192.168.178.0/24
    hosts deny  = 0.0.0.0/0
    write list = wolf streamstation scanner
    force user = nobody

[playlists]
    comment = FraWo Playlisten-Austausch (Rekordbox <-> Sender)
    path = /mnt/music/_playlisten
    browsable = yes
    read only = no
    guest ok = no
    hosts allow = 10.0.0.0/24 10.1.0.0/24 192.168.2.0/24 100.64.0.0/10 192.168.178.0/24
    hosts deny  = 0.0.0.0/0

