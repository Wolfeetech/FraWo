# Odoo Security Configuration für frawo-tech.de
# Datei: /etc/odoo/odoo.conf (oder custom config location)

[options]

# ============================================
# COOKIE SECURITY SETTINGS
# ============================================

# Session Cookie Security
# WICHTIG: Diese Settings erhöhen die Cookie-Sicherheit erheblich

# Cookie Secure Flag (nur über HTTPS)
# Aktiviert automatisch wenn Proxy richtig konfiguriert ist
session_cookie_secure = True

# Cookie SameSite Attribut (CSRF-Schutz)
# Optionen: 'lax', 'strict', 'none'
# 'lax' ist für die meisten Anwendungen der beste Kompromiss
session_cookie_samesite = lax

# HttpOnly Flag (bereits standardmäßig aktiviert, zur Sicherheit explizit)
session_cookie_httponly = True

# ============================================
# DATABASE SECURITY
# ============================================

# Database Manager deaktivieren (BEREITS GESETZT - gut!)
# list_db = False  # Verhindert Datenbank-Listing
# dbfilter = ^frawo.*$  # Nur Datenbanken mit "frawo" Präfix erlauben

# Admin Password (Master Password) sollte stark sein
# WICHTIG: Ändern Sie dieses Passwort!
# admin_passwd = IHR_STARKES_MASTER_PASSWORT_HIER

# ============================================
# SECURITY SETTINGS
# ============================================

# Limit Time CPU (verhindert DoS durch lange Queries)
limit_time_cpu = 60

# Limit Time Real (Gesamt-Request-Zeit)
limit_time_real = 120

# Limit Memory Hard (MB) - verhindert Memory-Exhaustion
limit_memory_hard = 2684354560

# Limit Memory Soft (MB)
limit_memory_soft = 2147483648

# ============================================
# LOGGING & MONITORING
# ============================================

# Log Level (für Security-Events)
log_level = info

# Log Handler (separate Security-Logs)
log_handler = :INFO

# Specific log for security events
# log_db = True  # Log in Datenbank für Audit-Trail

# ============================================
# PROXY SETTINGS (für Cloudflare/Caddy)
# ============================================

# Proxy Mode aktivieren (wichtig für korrekte Client-IPs)
proxy_mode = True

# X-Forwarded-* Headers vertrauen
# WICHTIG: Nur aktivieren wenn hinter vertrauenswürdigem Proxy!
# trust_proxy_headers = True

# ============================================
# RATE LIMITING & BRUTE FORCE PROTECTION
# ============================================

# Workers (Anzahl der Prozesse)
# Je nach Server-Größe anpassen
workers = 4

# Max CronThreads
max_cron_threads = 2

# ============================================
# FILE UPLOAD RESTRICTIONS
# ============================================

# Max Upload Size (MB) - verhindert zu große Uploads
limit_request = 8388608

# Limit Time für File Uploads
limit_time_real_cron = 300

# ============================================
# ADDITIONAL SECURITY RECOMMENDATIONS
# ============================================

# Server Wide Modules (nur notwendige Module laden)
# server_wide_modules = base,web

# Deaktiviere ungenutzte Addons-Pfade
# addons_path = /opt/odoo/addons,/opt/odoo/custom-addons

# ============================================
# NOTIZEN & WICHTIGE HINWEISE
# ============================================

# 1. Nach Änderungen Odoo neu starten:
#    sudo systemctl restart odoo
#
# 2. Cookie-Settings funktionieren nur wenn:
#    - Odoo Version >= 15.0 (ältere Versionen unterstützen diese nicht)
#    - Proxy korrekt konfiguriert (X-Forwarded-Proto: https)
#
# 3. Für Odoo 19 (SaaS) sind viele dieser Settings bereits optimal gesetzt
#    Diese Config ist primär für Self-Hosted Odoo Installationen
#
# 4. Für SaaS-Versionen (wie bei frawo-tech.de):
#    - Cookie-Settings können NICHT direkt geändert werden
#    - Alternative: Cloudflare Workers für Cookie-Manipulation nutzen
#
# 5. Backup dieser Datei vor Änderungen:
#    sudo cp /etc/odoo/odoo.conf /etc/odoo/odoo.conf.backup

