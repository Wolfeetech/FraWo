# SSH-Härtung Anker (proxmox-anker) — angelegt 29.07.2026
#
# Anlass: Beim Gegenprüfen von Odoo #884 stellte sich heraus, dass die dortige
# Aussage "SSH ist auf beiden Knoten sauber" für den Anker nicht stimmte.
# Der ProDesk hat seit November 2025 eine Härtungsdatei, der Anker hatte
# keine. In dessen sshd_config stand PasswordAuthentication nur auskommentiert
# — es galt also die Voreinstellung "yes".
#
# Wirksam war damit:
#   permitrootlogin without-password   (Root nur per Schlüssel — gut)
#   passwordauthentication yes         (alle anderen Konten per Passwort)
#
# Betroffen war konkret der Benutzer "wolf": Anmelde-Shell vorhanden,
# Passwort gesetzt. Root war durch die Schlüsselpflicht geschützt, wolf nicht.
# Erreichbar war das aus dem LAN und über Tailscale — nicht aus dem Internet
# (am Gateway existiert keine einzige Portweiterleitung) und nicht aus dem
# Gäste- oder IoT-Netz (dort ist Port 22 gesperrt).
#
# BEWUSST NICHT vom ProDesk übernommen, weil es hier Schaden anrichten könnte:
#   Banner /etc/ssh/banner.txt   — die Datei existiert auf dem Anker nicht,
#                                  sshd würde beim Start scheitern
#   AllowTcpForwarding no        — könnte bestehende Tunnel abschneiden
#   MaxSessions 2                — könnte parallele Automatik ausbremsen
#   Cipher-/MAC-/KexAlgorithms   — sinnvoll, aber eigener Schritt mit Test
#
# Zurückdrehen: Datei löschen und `systemctl reload ssh`.
# Sicherung des Vorzustands: es gab keine Datei — Löschen stellt ihn her.

# Root nur per Schlüssel (war schon wirksam, hier ausdrücklich festgehalten)
PermitRootLogin prohibit-password

# Der eigentliche Punkt: keine Anmeldung mit Passwort mehr
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no

# Nicht genutzte Verfahren abschalten
KerberosAuthentication no
GSSAPIAuthentication no
HostbasedAuthentication no
IgnoreRhosts yes

# Unnötige Angriffsfläche
X11Forwarding no

# Fehlversuche begrenzen und tote Sitzungen aufräumen
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Aussagekräftige Protokollierung — sonst sieht man einen Anmeldeversuch nicht
SyslogFacility AUTH
LogLevel VERBOSE
