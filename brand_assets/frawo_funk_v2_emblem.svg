<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <rect width="760" height="160" fill="#040605"/>
  <g transform="translate(40, 30)">
    <!-- THE BEATS-CALIBER 'FF' AUDIO EMBLEM -->
    <g transform="translate(0, 0)">
      <!-- Outer Matte Hexagon/Squircle -->
      <rect width="100" height="100" rx="24" fill="#0A0F0D" stroke="#00E599" stroke-width="2" stroke-opacity="0.3"/>
      
      <!-- Primary F (Titanium White) -->
      <path d="M 28,24 L 68,24 L 68,36 L 42,36 L 42,48 L 64,48 L 64,60 L 42,60 L 42,76 L 28,76 Z" fill="#FFFFFF"/>
      
      <!-- Staggered Accent F (Emerald Green) -->
      <path d="M 44,40 L 76,40 L 76,50 L 56,50 L 56,60 L 72,60 L 72,70 L 56,70 L 56,84 L 44,84 Z" fill="#00E599"/>
    </g>

    <!-- TYPOGRAPHIC WORDMARK -->
    <g transform="translate(130, 20)">
      <!-- FRAWO -->
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-2">FRAWO</text>
      <!-- FUNK -->
      <text x="280" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="#00E599" letter-spacing="-2">FUNK</text>
    </g>
  </g>
</svg>
