<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="32" fill="#0a0e0c" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  <g transform="translate(200, 200)">
    <!-- Minimalist Radio Frequency Rings -->
    <circle r="130" fill="none" stroke="#00e599" stroke-width="1.5" stroke-opacity="0.15"/>
    <circle r="100" fill="none" stroke="#00e599" stroke-width="2" stroke-opacity="0.3"/>
    <circle r="70" fill="none" stroke="#00e599" stroke-width="2.5" stroke-opacity="0.6"/>
    
    <!-- Center Solid Studio Core -->
    <circle r="36" fill="#00e599"/>
    
    <!-- Pure Typography Center/Bottom -->
    <text x="0" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="20" fill="#050706" letter-spacing="1">FF</text>
  </g>
  <text x="200" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">FRAWO FUNK</text>
  <text x="200" y="352" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#64748b" letter-spacing="3">BODENSEE</text>
</svg>
