<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <rect width="600" height="120" fill="#050706" rx="8"/>
  <g transform="translate(40, 75)">
    <!-- frawo funk in ultra-clean geometric lowercase -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1.5">frawo<tspan fill="#00e599">funk</tspan></text>
    
    <!-- Analog Audio Frequency Pulse -->
    <g transform="translate(300, -26)" stroke="#00e599" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="12" x2="0" y2="18"/>
      <line x1="6" y1="6" x2="6" y2="24"/>
      <line x1="12" y1="0" x2="12" y2="30"/>
      <line x1="18" y1="8" x2="18" y2="22"/>
      <line x1="24" y1="13" x2="24" y2="17"/>
    </g>
    
    <!-- Subtitle -->
    <text x="345" y="-12" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="3">24/7 RADIO</text>
  </g>
</svg>
