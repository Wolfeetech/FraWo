<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <rect width="600" height="120" fill="#050706" rx="8"/>
  <g transform="translate(30, 75)">
    <!-- FraWo Bold -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="48" fill="#ffffff" letter-spacing="-1">FraWo</text>
    
    <!-- FUNK in minimalist emerald studio box -->
    <g transform="translate(165, -38)">
      <rect width="140" height="46" rx="6" fill="rgba(0, 229, 153, 0.08)" stroke="#00e599" stroke-width="2"/>
      <text x="70" y="31" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-weight="900" font-size="24" fill="#00e599" letter-spacing="4">FUNK</text>
    </g>
    
    <!-- Minimalist Radio Dot & Subline -->
    <circle cx="325" cy="-15" r="4" fill="#00e599"/>
    <text x="340" y="-11" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" fill="#64748b" letter-spacing="2">STUDIO STREAM</text>
  </g>
