<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <rect width="720" height="180" fill="#060807"/>
  <g transform="translate(50, 35)">
    <!-- THE BESPOKE 'FF' SOUNDWAVE LIGATURE EMBLEM -->
    <g transform="translate(0, 5)">
      <!-- Outer Signal Frame -->
      <rect x="0" y="0" width="100" height="100" rx="20" fill="#0A0F0D" stroke="#00E599" stroke-width="2.5" stroke-opacity="0.4"/>
      
      <!-- Primary F (White Titanium) -->
      <path d="M 26,22 L 68,22 L 68,34 L 40,34 L 40,48 L 62,48 L 62,60 L 40,60 L 40,78 L 26,78 Z" fill="#FFFFFF"/>
      
      <!-- Offset Secondary F (Emerald Neon Shadow) -->
      <path d="M 44,38 L 78,38 L 78,48 L 56,48 L 56,58 L 74,58 L 74,68 L 56,68 L 56,84 L 44,84 Z" fill="#00E599"/>
    </g>

    <!-- TYPOGRAPHIC WORDMARK -->
    <g transform="translate(130, 20)">
      <!-- FRAWO -->
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" letter-spacing="-1.5">FRAWO</text>
      <!-- FUNK -->
      <text x="275" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="62" fill="#00E599" letter-spacing="-1.5">FUNK</text>
    </g>
  </g>
</svg>
