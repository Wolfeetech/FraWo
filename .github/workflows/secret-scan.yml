name: Secret Scan (gitleaks)

# Blockiert das Einchecken NEUER Secrets. Scannt nur die neu gepushten Commits
# (Diff), damit der bestehende History-Altbestand den Lauf nicht dauerhaft rot
# macht. Altbestand wird separat rotiert + bereinigt (Odoo #815).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks installieren
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Neue Commits auf Secrets prüfen
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="-1 HEAD"
            else
              RANGE="$BEFORE..HEAD"
            fi
          fi
          echo "Scanne Commit-Bereich: $RANGE"
          gitleaks git --log-opts="$RANGE" --redact --no-banner
