name: repo-hygiene

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  docs-and-security:
    name: Docs And Security Hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify canonical SSOT files exist
        run: |
          set -euo pipefail
          required=(
            README.md
            DOCS/Task_Archive/SECURITY.md
            archive/CONTRIBUTING.md
            DOCS/Task_Archive/AGENTS.md
            archive/OPS_HOME.md
            archive/LIVE_CONTEXT.md
            archive/MASTERPLAN.md
            archive/todo.md
            archive/AI_OPERATING_MODEL.md
            OPERATIONS/GITHUB_OPERATIONS.md
            COMMUNICATION/agent_board.md
            .github/dependabot.yml
            manifests/workspaces/canonical_workspace.json
            manifests/work_lanes/current_plan.json
            SSOT/START_HERE.md
          )

          missing=0
          for file in "${required[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo "$missing required file(s) missing."
            exit 1
          fi

      - name: Verify private OpenClaw key is not tracked
        run: |
          set -euo pipefail
          if git ls-files 'Codex/openclaw_id_ed25519*' | grep -q .; then
            echo "ERROR: OpenClaw key material is tracked."
            git ls-files 'Codex/openclaw_id_ed25519*'
            exit 1
          fi
          echo "OK: OpenClaw key material is not tracked."

      - name: Scan for obvious private key material
        run: |
          set -euo pipefail
          if git grep -n \
            -e "BEGIN OPENSSH PRIVATE KEY" \
            -e "BEGIN RSA PRIVATE KEY" \
            -e "BEGIN PRIVATE KEY" \
            -- . ':!.github/workflows/repo-hygiene.yml'; then
            echo "ERROR: Private key material found in tracked files."
            exit 1
          fi
          echo "OK: no tracked private key blocks found."

      - name: Guard tracked plaintext credential artifacts
        run: |
          set -euo pipefail

          legacy_env_allowlist=(
            "apps/yourparty/apps/api/.env.prod"
            "apps/yourparty/apps/api/.env.production"
          )

          tracked_env_runtime=$(git ls-files '**/.env' '**/.env.*' \
            | grep -Ev '(^|/)\.env(\..+)?\.example$|(^|/)\.env\.template$|(^|/)\.env\.sample$' || true)

          if [ -n "$tracked_env_runtime" ]; then
            unexpected_env_runtime="$tracked_env_runtime"
            for legacy_env in "${legacy_env_allowlist[@]}"; do
              unexpected_env_runtime=$(printf '%s\n' "$unexpected_env_runtime" | grep -vxF "$legacy_env" || true)
            done
            if [ -n "$unexpected_env_runtime" ]; then
              echo "ERROR: Unexpected tracked runtime .env files detected:"
              printf '%s\n' "$unexpected_env_runtime"
              exit 1
            fi
            echo "WARN: legacy tracked runtime .env files still present (migration debt):"
            printf '%s\n' "$tracked_env_runtime"
          fi

          if git ls-files '*.credentials' '**/*.credentials' | grep -q .; then
            echo "ERROR: plaintext *.credentials files must not be tracked."
            git ls-files '*.credentials' '**/*.credentials'
            exit 1
          fi

          if git ls-files 'CREDENTIALS.local.md' '**/CREDENTIALS.local.md' 'OPERATIONS/CREDENTIAL_INVENTORY.local.md' | grep -q .; then
            echo "ERROR: local credential markdown handoff files are tracked."
            git ls-files 'CREDENTIALS.local.md' '**/CREDENTIALS.local.md' 'OPERATIONS/CREDENTIAL_INVENTORY.local.md'
            exit 1
          fi

          echo "OK: tracked plaintext credential artifact guardrails passed."

      - name: Validate JSON manifests
        run: |
          set -euo pipefail
          python -m json.tool manifests/workspaces/canonical_workspace.json >/dev/null
          python -m json.tool manifests/work_lanes/current_plan.json >/dev/null
          echo "OK: JSON manifests parse."

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' \
            --ignore _logs/ \
            .github/workflows/ \
            ansible/playbooks/ \
            ansible/inventory/ || true
